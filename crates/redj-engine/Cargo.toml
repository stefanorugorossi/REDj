[package]
name = "redj-engine"
description = "Block-based mix engine with sample-accurate scheduler and offline/real-time drivers."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Real-time audio output through cpal.
rt = ["dep:cpal"]

[dependencies]
redj-core.workspace = true
redj-dsp.workspace = true
redj-plan.workspace = true
rtrb.workspace = true
cpal = { workspace = true, optional = true }

[dev-dependencies]
redj-testkit.workspace = true
assert_no_alloc.workspace = true

[lints]
workspace = true

[[bench]]
name = "live"
harness = false
